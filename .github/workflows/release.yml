name: Build and Release XenonForge

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare embedded catalog and STFS template
        shell: powershell
        run: .\prepare-assets.ps1

      - name: Publish single EXE
        shell: powershell
        run: dotnet publish .\XenonForge\XenonForge.vbproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish

      - name: Smoke test startup
        shell: powershell
        run: |
          $logDir = Join-Path $env:LOCALAPPDATA "XenonForge"
          Remove-Item -Recurse -Force $logDir -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath ".\publish\XenonForge.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            Write-Host "XenonForge exited during startup with code $($p.ExitCode)."
            $log = Join-Path $logDir "startup-crash.log"
            if (Test-Path $log) {
              Write-Host "----- startup-crash.log -----"
              Get-Content $log
              Write-Host "-----------------------------"
            }
            throw "XenonForge failed startup smoke test."
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Startup smoke test passed."

      - name: Package release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item .\publish\XenonForge.exe .\release\XenonForge.exe
          Copy-Item .\README.md .\release\README.md
          Copy-Item .\LICENSE .\release\LICENSE
          Copy-Item .\THIRD-PARTY-NOTICES.txt .\release\THIRD-PARTY-NOTICES.txt
          Compress-Archive -Path .\release\* -DestinationPath .\XenonForge-win-x64.zip -Force
          (Get-FileHash .\XenonForge-win-x64.zip -Algorithm SHA256).Hash | Set-Content .\XenonForge-win-x64.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XenonForge-win-x64
          path: |
            XenonForge-win-x64.zip
            XenonForge-win-x64.zip.sha256
            publish/XenonForge.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v1.0.0"
            gh release view $tag --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $tag already exists; skipping bootstrap release."
              exit 0
            }
          }
          gh release create $tag .\XenonForge-win-x64.zip .\XenonForge-win-x64.zip.sha256 .\publish\XenonForge.exe --target "${{ github.sha }}" --title "XenonForge $tag" --notes-file .\RELEASE_NOTES.md
