name: Build and Release XenonForge

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare embedded catalog and STFS template
        shell: powershell
        run: .\prepare-assets.ps1

      - name: Publish single EXE
        shell: powershell
        run: dotnet publish .\XenonForge\XenonForge.vbproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish

      - name: Package release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item .\publish\XenonForge.exe .\release\XenonForge.exe
          Copy-Item .\README.md .\release\README.md
          Copy-Item .\LICENSE .\release\LICENSE
          Copy-Item .\THIRD-PARTY-NOTICES.txt .\release\THIRD-PARTY-NOTICES.txt
          Compress-Archive -Path .\release\* -DestinationPath .\XenonForge-win-x64.zip -Force
          (Get-FileHash .\XenonForge-win-x64.zip -Algorithm SHA256).Hash | Set-Content .\XenonForge-win-x64.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XenonForge-win-x64
          path: |
            XenonForge-win-x64.zip
            XenonForge-win-x64.zip.sha256
            publish/XenonForge.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" .\XenonForge-win-x64.zip .\XenonForge-win-x64.zip.sha256 .\publish\XenonForge.exe --title "XenonForge ${{ github.ref_name }}" --notes "First XenonForge release: native VB.NET ISO-to-GOD engine, game identification, modern queue UI, smart trim and direct USB deployment. No iso2god.exe required."
